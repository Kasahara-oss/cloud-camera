<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイ位置情報マップ</title>
    
    <!-- 完全に安全なHTTPS通信で地図データを読み込む -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    <script src="https://cloudflare.com"></script>

    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f0f0f0; text-align: center; }
        h1 { font-size: 18px; margin: 10px 0; color: #333; }
        #mapArea { width: 100%; height: 80vh; background: #ddd; }
        #status { font-size: 14px; color: #666; margin: 5px; padding: 0 10px; }
    </style>
</head>
<body>

    <h1>自分だけのGPSマップ</h1>
    <div id="status">位置情報を取得中（最大10秒お待ちください）...</div>
    <div id="mapArea"></div>

    <script>
        // 地図の初期設定（最初は日本全体を表示）
        const map = L.map('mapArea').setView([35.68, 139.76], 5);
        const statusText = document.getElementById('status');

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // iPhoneのガードを突破するGPS設定（タイムアウトと過去データ利用をON）
        const gpsOptions = {
            enableHighAccuracy: false, // 部屋の中でも拾いやすいように緩める
            timeout: 10000,            // 10秒経ったらフリーズせずエラーを出す
            maximumAge: 60000          // 1分以内にスマホが取得した位置があればそれを即採用
        };

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(successGPS, errorGPS, gpsOptions);
        } else {
            statusText.innerText = "お使いのブラウザはGPSに対応していません。";
        }

        function successGPS(position) {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            statusText.innerText = `現在地を検出しました！（緯度:${latitude.toFixed(4)}, 経度:${longitude.toFixed(4)}）`;
            map.setView([latitude, longitude], 16);

            L.marker([latitude, longitude]).addTo(map)
                .bindPopup('あなたはココにいます！')
                .openPopup();
        }

        function errorGPS(error) {
            // フリーズせず、ここを通って画面に原因を表示させます
            statusText.innerText = `エラーが発生しました (${error.message})。スマホの設定や電波を確認してください。`;
        }
    </script>
</body>
</html>

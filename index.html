<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイ位置情報数値化アプリ</title>
    <style>
        /* 画面全体のデザイン設定（数字を大きく見やすくする） */
        body { font-family: sans-serif; margin: 0; padding: 40px 20px; background: #222; color: #fff; text-align: center; }
        h1 { font-size: 22px; margin-bottom: 30px; color: #007aff; }
        .result-box { background: #333; padding: 20px; border-radius: 10px; margin: 20px 0; font-size: 18px; line-height: 2; }
        .number { font-size: 28px; font-weight: bold; color: #4cd964; }
        #status { font-size: 16px; color: #aaa; }
    </style>
</head>
<body>

    <h1>自分だけのGPS数値化</h1>
    
    <div id="status">位置情報を取得中...</div>

    <!-- 緯度と経度を表示するエリア -->
    <div class="result-box">
        <div>緯度 (Latitude):</div>
        <div id="latArea" class="number">--.----</div>
        <div style="margin-top: 10px;">経度 (Longitude):</div>
        <div id="lonArea" class="number">--.----</div>
    </div>

    <script>
        const statusText = document.getElementById('status');
        const latText = document.getElementById('latArea');
        const lonText = document.getElementById('lonArea');

        // スマホのGPS機能にアクセス（過去の古いデータを即座に再利用する超軽量設定）
        const options = {
            enableHighAccuracy: false,
            maximumAge: 300000 // 5分以内にスマホが測ったデータがあれば即採用
        };

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(successGPS, errorGPS, options);
        } else {
            statusText.innerText = "お使いのブラウザはGPSに対応していません。";
        }

        // GPS取得成功
        function successGPS(position) {
            statusText.innerText = "現在地を正常に検出しました！";
            latText.innerText = position.coords.latitude.toFixed(5);   // 緯度を小数点5桁まで表示
            lonText.innerText = position.coords.longitude.toFixed(5);  // 経度を小数点5桁まで表示
        }

        // GPS取得失敗
        function errorGPS(error) {
            statusText.innerText = "エラー発生: " + error.message;
        }
    </script>
</body>
</html>
